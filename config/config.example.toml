[llm]
# api_key = "sk-xxx"              # or set RAGENT_API_KEY env var
# OpenAI: api_base = "https://api.openai.com/v1"
# Anthropic / MiniMax-compatible: use full root, e.g.
#   https://api.anthropic.com
#   https://api.minimaxi.com/anthropic   (or origin-only https://api.minimaxi.com — ragent appends /anthropic)
# OpenAI-compatible `api_base`: chat/completions uses streamed SSE—fewer nginx/proxy 504 idle timeouts vs one huge reply.
model = "gpt-4o"
provider = "openai"               # "openai" or "anthropic"

[llm.retry]
enabled = true
max_retries = 3
initial_delay_ms = 1000
max_delay_ms = 30000

[agent]
max_steps = 50
max_context_tokens = 100000
# system_prompt_path = "config/system_prompt.md"
# workspace_dir = "."

[tools]
enable_file_tools = true
enable_bash = true
enable_note = true
enable_mcp = false
# mcp_config_path = "config/mcp.json"

# OpenAI only: native hosted `web_search` on `/v1/responses` (same idea as codex-rs; no local crawler).
# web_search_mode = "disabled"   # "live" | "cached" | "disabled" — default is disabled
# Optional: [tools.web_search] for filters and context (see commented block below).

[tools.mcp]
connect_timeout_secs = 10
execute_timeout_secs = 60

# [tools.web_search]
# context_size = "high"
# allowed_domains = ["docs.rs"]
#
# [tools.web_search.location]
# country = "US"

[skills]
enabled = false
# skills_dir = "./skills"          # default ./skills under cwd when enabled; use {SKILLS_METADATA} in system prompt

[logging]
level = "info"
# session_log = true              # one file per chat turn under log_dir (LLM I/O + tool results)
# log_dir = "./logs"              # default: ~/.ragent/log
