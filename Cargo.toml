[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/traits",
    "crates/llm",
    "crates/tools",
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ragent-types = { path = "crates/types" }
ragent-traits = { path = "crates/traits" }
ragent-llm = { path = "crates/llm" }
ragent-tools = { path = "crates/tools" }
ragent-core = { path = "crates/core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
clap = { version = "4", features = ["derive"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_yaml = "0.9"
regex = "1"
pretty_assertions = "1"
ratatui = "0.29.0"
crossterm = "0.28.1"
